<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>《補簽遠行》全地圖互動平面圖工作室（PoE 2 架構設計＆AI 生圖參考）</title>
<style>
  :root {
    --bg: #f6efe0;
    --panel: #fbf6ea;
    --ink: #273244;
    --muted: #626d7f;
    --gold: #c89646;
    --teal: #34a8a2;
    --coral: #d96b59;
    --border: #d8c7a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 18px; background: #263144; color: #fbf2df; border-bottom: 3px solid var(--gold);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #536480; background: #324059; color: #e8eef7; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.15s;
  }
  .tab.active { background: var(--gold); color: #1c2432; border-color: #f5d284; font-weight: 700; }
  .main { display: flex; flex: 1; min-height: 0; }
  .canvas-wrap {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    background: #e6dbc5; padding: 14px; overflow: hidden;
  }
  canvas {
    background: #f4ebd9; border: 2px solid var(--gold); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(30, 35, 50, 0.14); max-width: 100%; max-height: 100%; cursor: crosshair;
  }
  .coord-hud {
    position: absolute; left: 26px; bottom: 24px; background: rgba(34, 44, 62, 0.88);
    color: #fff3d6; padding: 6px 12px; border-radius: 8px; font-size: 12px; pointer-events: none;
    border: 1px solid var(--gold);
  }
  .sidebar {
    width: 340px; background: var(--panel); border-left: 2px solid var(--border);
    padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .card {
    background: #fffdf7; border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 13.5px; color: #78481d; border-bottom: 1px dashed var(--border); padding-bottom: 5px; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12.5px; }
  .layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-row { display: flex; flex-direction: column; gap: 7px; }
  button.action {
    border: none; border-radius: 8px; padding: 8px 11px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; background: #2d3c54; color: #fff7e6; transition: 0.15s; text-align: left;
  }
  button.action:hover { background: #3c4f6e; }
  button.action.gold { background: var(--gold); color: #1c2432; }
  button.action.teal { background: var(--teal); color: #fff; }
  button.action.coral { background: var(--coral); color: #fff; }
  .info-box { font-size: 12.5px; line-height: 1.55; color: #364154; }
  .pin-list { display: flex; flex-direction: column; gap: 5px; max-height: 130px; overflow-y: auto; font-size: 12px; }
  .pin-item {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: #f5ecd7; padding: 4px 8px; border-radius: 6px;
  }
  .pin-item button { border: none; background: transparent; color: #b83a2d; cursor: pointer; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .toast {
    position: fixed; top: 64px; right: 24px; background: #263144; color: #ffe7a3;
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--gold); font-size: 13px;
    opacity: 0; transition: 0.2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🗺 《補簽遠行》互動平面圖設計工作室</h1>
  <div class="tabs" id="tabs"></div>
</header>
<div class="main">
  <div class="canvas-wrap">
    <canvas id="mapCanvas" width="1120" height="720"></canvas>
    <div class="coord-hud" id="coordHud">游標座標：X=0.0, Z=0.0 ｜ 拖曳節點可微調位置，點擊空白處可新增設計備註</div>
  </div>
  <aside class="sidebar">
    <div class="card">
      <h3>🧭 當前地圖摘要</h3>
      <div class="info-box" id="mapSummary"></div>
    </div>
    <div class="card">
      <h3>🔍 選取項目／座標檢視</h3>
      <div class="info-box" id="selectedInfo">點擊或拖曳地圖上任何圖示，即可檢視精確 Godot 座標（Vector3）並調整擺位。</div>
    </div>
    <div class="card">
      <h3>👁 圖層顯示開關</h3>
      <div class="layers">
        <label><input type="checkbox" id="lyrGrid" checked /> 座標網格 (10m)</label>
        <label><input type="checkbox" id="lyrSub" checked /> 子區域色塊</label>
        <label><input type="checkbox" id="lyrPath" checked /> 道路與溪流</label>
        <label><input type="checkbox" id="lyrBorder" checked /> 實體邊界阻擋</label>
        <label><input type="checkbox" id="lyrMobs" checked /> 怪物與傳奇怪</label>
        <label><input type="checkbox" id="lyrLabels" checked /> 中文名稱標註</label>
      </div>
    </div>
    <div class="card">
      <h3>📌 自訂設計修改標記（點擊地圖新增）</h3>
      <div class="pin-list" id="pinList"><span style="color:#8a94a6">尚無自訂標記，直接點擊平面圖空白處即可加上「這裡想加寶箱／改地形」備註。</span></div>
    </div>
    <div class="card">
      <h3>⚡ 協作與 AI 生圖工具</h3>
      <div class="btn-row">
        <button class="action gold" id="btnCopySpec">📋 複製給 Gemini 的修改設計指令</button>
        <button class="action teal" id="btnCopyPrompt">🎨 複製 AI 生圖 Prompt（@amelicart 水粉平面圖）</button>
        <button class="action coral" id="btnExportPng">🖼 匯出高解析 PNG 平面圖（可供 AI 圖生圖參考）</button>
      </div>
    </div>
    <div class="card">
      <h3>🎨 圖例</h3>
      <div class="legend">
        <span><i class="dot" style="background:#34b8b0"></i>傳送石陣 / 檢查點</span>
        <span><i class="dot" style="background:#98e882"></i>出入口</span>
        <span><i class="dot" style="background:#e86b6b"></i>普通小怪</span>
        <span><i class="dot" style="background:#f5c03b"></i>金色精英</span>
        <span><i class="dot" style="background:#ff7b3b"></i>隱藏傳奇怪</span>
        <span><i class="dot" style="background:#c92a2a"></i>區域 Boss</span>
        <span><i class="dot" style="background:#5b9cf0"></i>NPC / 設施</span>
      </div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

      { x: 10, z: 0, rx: 22, rz: 15, color: "rgba(212,188,148,0.72)", label: "4. 中境鐘聲廣場" },

    paths: [
      [[-68, 0], [-42, 0], [-14, 1.5], [14, -1.5], [38, 0], [62, 0], [80, 0]],
      [[-50, -4], [-36, -18], [-20, -28], [-34, -40]], [[-20, -28], [-2, -30], [14, -16]],
      [[-50, 4], [-34, 18], [-16, 30], [14, 40.5]], [[-16, 30], [6, 22], [24, 10]]
    ],
    streams: [],
    pois: [
      { id: "exit_w", x: -68.0, z: 0.0, kind: "exit", name: "← 返回翡翠天梯古林" },
      { id: "wp", x: -58.0, z: -4.5, kind: "checkpoint", name: "✦ 鐘樓傳送石陣 [U 世界圖]" },
      { id: "cp1", x: -20.0, z: -25.0, kind: "checkpoint", name: "◆ 檢查點：齒輪工坊廢墟" },
      { id: "rare_n", x: -6.0, z: -28.0, kind: "rare", name: "★ 齒輪維修長" },
      { id: "uniq1", x: -34.0, z: -40.0, kind: "unique", name: "❖ 隱藏傳奇怪 #1：發條報時官 (HP 36)" },
      { id: "cp2", x: -14.0, z: 25.0, kind: "checkpoint", name: "◆ 檢查點：舊軍砲壘壕溝" },
      { id: "rare_s", x: 2.0, z: 28.0, kind: "rare", name: "★ 鐵甲砲兵長" },
      { id: "uniq2", x: 14.0, z: 40.5, kind: "unique", name: "❖ 隱藏傳奇怪 #2：失控重型攻城機兵 (HP 38)" },
      { id: "rare_c", x: 20.0, z: -1.0, kind: "rare", name: "★ 鐘樓禁衛隊長" },

      { id: "boss", x: 62.0, z: 0.0, kind: "boss", name: "💀 區域 Boss：重裝鐵鐘騎士（退休後開咖啡座）" },
      { id: "exit_e", x: 80.0, z: 0.0, kind: "exit", name: "→ 沉霧燈塔港（第一幕終章）" },

let curIdx = 2; // Default to CloudhillRoad
let selectedPoi = null;
let draggingPoi = null;
const customPins = { clearing: [], town: [], road: [], forest: [], clocktower: [] };
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

function curMap() { return MAPS[curIdx]; }

function worldToCanvas(x, z, m = curMap()) {
  const pad = 42;
  const uw = canvas.width - pad * 2;
  const uh = canvas.height - pad * 2;
  const nx = (x - m.bounds.minX) / (m.bounds.maxX - m.bounds.minX);
  const nz = (z - m.bounds.minZ) / (m.bounds.maxZ - m.bounds.minZ);
  return { cx: pad + nx * uw, cy: pad + nz * uh };
}

function canvasToWorld(cx, cy, m = curMap()) {
  const pad = 42;
  const uw = canvas.width - pad * 2;
  const uh = canvas.height - pad * 2;
  const x = m.bounds.minX + ((cx - pad) / uw) * (m.bounds.maxX - m.bounds.minX);
  const z = m.bounds.minZ + ((cy - pad) / uh) * (m.bounds.maxZ - m.bounds.minZ);
  return { x: Math.round(x * 10) / 10, z: Math.round(z * 10) / 10 };
}

function poiColor(k) {
  return { checkpoint: "#34b8b0", exit: "#98e882", rare: "#f5c03b", unique: "#ff7b3b", boss: "#c92a2a", npc: "#5b9cf0", mob: "#e86b6b" }[k] || "#666";
}

function draw() {
  const m = curMap();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = m.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const tl = worldToCanvas(m.bounds.minX + 3, m.bounds.minZ + 3, m);
  const br = worldToCanvas(m.bounds.maxX - 3, m.bounds.maxZ - 3, m);
  ctx.fillStyle = m.land;
  ctx.beginPath();
  ctx.roundRect(tl.cx, tl.cy, br.cx - tl.cx, br.cy - tl.cy, 22);
  ctx.fill();

  if (document.getElementById("lyrSub").checked) {
    for (const r of m.regions) {
      const p = worldToCanvas(r.x, r.z, m);
      const sx = (r.rx / (m.bounds.maxX - m.bounds.minX)) * (canvas.width - 84);
      const sz = (r.rz / (m.bounds.maxZ - m.bounds.minZ)) * (canvas.height - 84);
      ctx.fillStyle = r.color;
      ctx.beginPath();
      ctx.ellipse(p.cx, p.cy, sx, sz, 0, 0, Math.PI * 2);
      ctx.fill();
      if (document.getElementById("lyrLabels").checked) {
        ctx.fillStyle = "rgba(30,38,52,0.78)";
        ctx.font = "bold 13px -apple-system, PingFang TC, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(r.label, p.cx, p.cy - sz + 18);
      }
    }
  }

  if (document.getElementById("lyrGrid").checked) {
    ctx.strokeStyle = "rgba(255,255,255,0.16)";
    ctx.lineWidth = 1;
    for (let x = Math.ceil(m.bounds.minX / 10) * 10; x <= m.bounds.maxX; x += 10) {
      const p0 = worldToCanvas(x, m.bounds.minZ, m);
      const p1 = worldToCanvas(x, m.bounds.maxZ, m);
      ctx.beginPath(); ctx.moveTo(p0.cx, p0.cy); ctx.lineTo(p1.cx, p1.cy); ctx.stroke();
    }
    for (let z = Math.ceil(m.bounds.minZ / 10) * 10; z <= m.bounds.maxZ; z += 10) {
      const p0 = worldToCanvas(m.bounds.minX, z, m);
      const p1 = worldToCanvas(m.bounds.maxX, z, m);
      ctx.beginPath(); ctx.moveTo(p0.cx, p0.cy); ctx.lineTo(p1.cx, p1.cy); ctx.stroke();
    }
  }

  if (document.getElementById("lyrPath").checked) {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of m.streams) {
      ctx.strokeStyle = "#4bc5e8"; ctx.lineWidth = 16;
      ctx.beginPath();
      s.forEach((pt, idx) => { const p = worldToCanvas(pt[0], pt[1], m); idx ? ctx.lineTo(p.cx, p.cy) : ctx.moveTo(p.cx, p.cy); });
      ctx.stroke();
    }
    for (const path of m.paths) {
      ctx.strokeStyle = "rgba(244,218,166,0.88)"; ctx.lineWidth = 9;
      ctx.beginPath();
      path.forEach((pt, idx) => { const p = worldToCanvas(pt[0], pt[1], m); idx ? ctx.lineTo(p.cx, p.cy) : ctx.moveTo(p.cx, p.cy); });
      ctx.stroke();
    }
  }

  if (document.getElementById("lyrBorder").checked) {
    ctx.strokeStyle = "#5c3d28"; ctx.lineWidth = 5; ctx.setLineDash([12, 6]);
    ctx.strokeRect(tl.cx, tl.cy, br.cx - tl.cx, br.cy - tl.cy);
    ctx.setLineDash([]);
  }

  if (document.getElementById("lyrMobs").checked) {
    for (const poi of m.pois) {
      const p = worldToCanvas(poi.x, poi.z, m);
      const rad = (poi.kind === "boss" || poi.kind === "unique") ? 13 : (poi.kind === "rare" ? 10 : 8.5);
      if (selectedPoi === poi) {
        ctx.fillStyle = "rgba(255,235,120,0.45)";
        ctx.beginPath(); ctx.arc(p.cx, p.cy, rad + 8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = poiColor(poi.kind);
      ctx.beginPath(); ctx.arc(p.cx, p.cy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#1d2534"; ctx.lineWidth = 2; ctx.stroke();
      if (document.getElementById("lyrLabels").checked) {
        ctx.font = "bold 11.5px -apple-system, PingFang TC, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255,252,240,0.9)";
        ctx.fillText(poi.name, p.cx + 1, p.cy - rad - 5);
        ctx.fillStyle = "#1d2534";
        ctx.fillText(poi.name, p.cx, p.cy - rad - 6);
      }
    }
  }

  // Custom user design pins
  for (const pin of customPins[m.id]) {
    const p = worldToCanvas(pin.x, pin.z, m);
    ctx.fillStyle = "#e03c72";
    ctx.beginPath(); ctx.arc(p.cx, p.cy, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = "bold 12px -apple-system, PingFang TC, sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.fillText("📌 " + pin.note, p.cx + 12, p.cy + 4);
  }
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  MAPS.forEach((m, idx) => {
    const b = document.createElement("button");
    b.className = "tab" + (idx === curIdx ? " active" : "");
    b.textContent = m.name;
    b.onclick = () => { curIdx = idx; selectedPoi = null; updateUI(); };
    el.appendChild(b);
  });
}

function updateUI() {
  renderTabs();
  const m = curMap();
  document.getElementById("mapSummary").innerHTML = `<b>${m.name}</b><br/>${m.desc}<br/><span style="color:#78481d">邊界樣式：${m.borderStyle}</span>`;
  document.getElementById("selectedInfo").innerHTML = selectedPoi
    ? `<b>${selectedPoi.name}</b><br/>類型：${selectedPoi.kind}<br/>Godot 座標：<code>Vector3(${selectedPoi.x.toFixed(1)}, 0.0, ${selectedPoi.z.toFixed(1)})</code><br/><span style="color:#626d7f">可直接拖曳此圖示微調位置！</span>`
    : "點擊或拖曳地圖上任何圖示，即可檢視精確 Godot 座標（Vector3）並調整擺位。";
  const pl = document.getElementById("pinList");
  const pins = customPins[m.id];
  if (!pins.length) {
    pl.innerHTML = '<span style="color:#8a94a6">尚無自訂標記，直接點擊平面圖空白處即可加上「這裡想加寶箱／改地形」備註。</span>';
  } else {
    pl.innerHTML = "";
    pins.forEach((pin, idx) => {
      const row = document.createElement("div");
      row.className = "pin-item";
      row.innerHTML = `<span>📌 ${pin.note} (${pin.x}, ${pin.z})</span><button title="刪除">✕</button>`;
      row.querySelector("button").onclick = () => { pins.splice(idx, 1); updateUI(); };
      pl.appendChild(row);
    });
  }
  draw();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function getCanvasPt(evt) {
  const rect = canvas.getBoundingClientRect();
  return { cx: (evt.clientX - rect.left) * (canvas.width / rect.width), cy: (evt.clientY - rect.top) * (canvas.height / rect.height) };
}

canvas.addEventListener("mousedown", (evt) => {
  const { cx, cy } = getCanvasPt(evt);
  const m = curMap();
  for (const poi of m.pois) {
    const p = worldToCanvas(poi.x, poi.z, m);
    if (Math.hypot(p.cx - cx, p.cy - cy) < 16) {
      selectedPoi = poi; draggingPoi = poi; updateUI(); return;
    }
  }
  const w = canvasToWorld(cx, cy, m);
  const note = prompt(`在座標 (${w.x}, ${w.z}) 新增設計備註（例如：新增傳奇怪／加一條小橋）：`);
  if (note && note.trim()) {
    customPins[m.id].push({ x: w.x, z: w.z, note: note.trim() });
    updateUI();
  }
});

canvas.addEventListener("mousemove", (evt) => {
  const { cx, cy } = getCanvasPt(evt);
  const w = canvasToWorld(cx, cy);
  document.getElementById("coordHud").textContent = `游標座標：Vector3(${w.x.toFixed(1)}, 0.0, ${w.z.toFixed(1)}) ｜ 拖曳節點可微調，點擊空白可加設計備註`;
  if (draggingPoi) {
    draggingPoi.x = w.x; draggingPoi.z = w.z; updateUI();
  }
});

window.addEventListener("mouseup", () => { draggingPoi = null; });
document.querySelectorAll(".layers input").forEach(cb => cb.addEventListener("change", draw));

document.getElementById("btnCopySpec").onclick = () => {
  const m = curMap();
  const lines = [
    `### 地圖設計調整規格：${m.name}`,
    `- 邊界阻擋樣式：${m.borderStyle}`,
    `- 主要地標與怪物座標：`,
    ...m.pois.map(p => `  - ${p.name} [${p.kind}]: Vector3(${p.x.toFixed(1)}, 0.0, ${p.z.toFixed(1)})`),
  ];
  if (customPins[m.id].length) {
    lines.push(`- 新增設計備註：`);
    customPins[m.id].forEach(pin => lines.push(`  - 📌 ${pin.note} @ Vector3(${pin.x.toFixed(1)}, 0.0, ${pin.z.toFixed(1)})`));
  }
  navigator.clipboard.writeText(lines.join("\n"));
  showToast("已複製設計修改規格！可直接貼回給 Gemini 套用至 Godot");
};

document.getElementById("btnCopyPrompt").onclick = () => {
  const m = curMap();
  const regStr = m.regions.map(r => r.label).join(", ");
  const promptText = `Top-down 2.5D perspective fixed oblique RPG level concept map of "${m.name}" for "After the Ceasefire", painted in @amelicart matte gouache dry-brush art style with @shoejaat miniature diorama charm. Layout features interconnected zones: ${regStr}. Natural edge borders: ${m.borderStyle}. Clear readable dirt trails, sparkling water streams, cozy glowing waypoints, golden elite glades, and deep hidden boss arena. Warm sunlight, soft lavender-purple shadows, minimalist clean composition, no UI clutter.`;
  navigator.clipboard.writeText(promptText);
  showToast("已複製 AI 生圖 Prompt！可直接貼到生圖工具使用");
};

document.getElementById("btnExportPng").onclick = () => {
  const a = document.createElement("a");
  a.download = `floorplan_${curMap().id}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
  showToast("已匯出高解析 PNG 平面圖！");
};

updateUI();
</script>
